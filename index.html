<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Maison Riviera | Interactive Luxury Portal</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel (Compiles JSX directly in browser) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    h1, h2, h3, h4, .font-serif { font-family: 'Playfair Display', serif; }
  </style>
</head>
<body class="bg-[#0A0B0D] text-[#ECE7E1] selection:bg-[#C5A059] selection:text-black min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function MaisonRivieraApp() {
      // --- SITE STATE (Editable via Admin Panel) ---
      const [siteData, setSiteData] = useState({
        heroTitle: "Experience European Luxury in the Heart of Dubai",
        heroSub: "Discover exclusive Spanish and French-inspired residences in Dubai's most prestigious locations.",
        properties: [
          { id: 1, type: "Studio", size: "480 - 620 SQ.FT", price: "AED 1,200,000", status: "Available", img: "https://images.unsplash.com/photo-1502672260266-1c1ef2d93688?auto=format&fit=crop&w=800&q=80" },
          { id: 2, type: "1 Bedroom", size: "780 - 950 SQ.FT", price: "AED 1,900,000", status: "Available", img: "https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?auto=format&fit=crop&w=800&q=80" },
          { id: 3, type: "2 Bedroom", size: "1,250 - 1,500 SQ.FT", price: "AED 2,800,000", status: "Limited", img: "https://images.unsplash.com/photo-1600566753376-12c8ab7fb75b?auto=format&fit=crop&w=800&q=80" },
          { id: 4, type: "3 Bedroom", size: "1,950 - 2,400 SQ.FT", price: "AED 4,500,000", status: "Available", img: "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=800&q=80" }
        ]
      });

      // --- UI STATES ---
      const [activeModal, setActiveModal] = useState(null); // 'inquire', 'consultation', 'admin'
      const [selectedProperty, setSelectedProperty] = useState(null);
      const [openFaq, setOpenFaq] = useState(null);
      const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(false);
      const [adminPassword, setAdminPassword] = useState('');
      const [botHoneypot, setBotHoneypot] = useState('');
      const [formSuccess, setFormSuccess] = useState(false);

      // Trigger lucide icons whenever modals change
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [activeModal, openFaq]);

      // --- FAQS DATA ---
      const faqs = [
        { q: "Can foreigners buy off-plan property in Dubai?", a: "Yes, Dubai offers 100% freehold property ownership to international buyers and expatriates in designated luxury zones." },
        { q: "What is the standard payment plan structure?", a: "Our typical payment schedule consists of 10% on booking, 40% during construction, and 50% upon final handover." },
        { q: "Are these properties eligible for the UAE Golden Visa?", a: "Properties valued at AED 2,000,000 or above qualify buyers for the 10-Year UAE Golden Residency Visa." }
      ];

      // --- SECURITY & BOT PROTECTION ---
      const handleLeadSubmit = (e) => {
        e.preventDefault();
        // Anti-bot check: Reject if honeypot field is filled by an automated bot/chatbot
        if (botHoneypot !== '') {
          alert("Bot activity detected. Submission blocked.");
          return;
        }
        setFormSuccess(true);
        setTimeout(() => {
          setFormSuccess(false);
          setActiveModal(null);
        }, 2000);
      };

      const handleAdminLogin = (e) => {
        e.preventDefault();
        if (adminPassword === 'admin123') {
          setIsAdminAuthenticated(true);
        } else {
          alert("Invalid Security Password.");
        }
      };

      const updatePropertyPrice = (id, newPrice) => {
        setSiteData(prev => ({
          ...prev,
          properties: prev.properties.map(p => p.id === id ? { ...p, price: newPrice } : p)
        }));
      };

      return (
        <div className="bg-[#0A0B0D] text-[#ECE7E1] font-sans selection:bg-[#C5A059] selection:text-black min-h-screen">
          
          <!-- Navigation -->
          <nav className="fixed top-0 left-0 w-full z-40 bg-[#0A0B0D]/90 backdrop-blur-md border-b border-[#C5A059]/20 py-4">
            <div className="max-w-7xl mx-auto px-6 flex justify-between items-center">
              <a href="#" className="text-2xl font-serif tracking-widest text-[#ECE7E1] uppercase">
                <span className="text-[#C5A059]">MAISON</span> RIVIERA
              </a>
              <div className="hidden lg:flex items-center gap-6 text-xs uppercase tracking-widest text-[#ECE7E1]/80">
                <a href="#properties" className="hover:text-[#C5A059] transition-colors">Properties</a>
                <a href="#faq" className="hover:text-[#C5A059] transition-colors">FAQ</a>
              </div>
              <div className="flex gap-4">
                <button 
                  onClick={() => setActiveModal('admin')} 
                  className="border border-[#ECE7E1]/20 px-3 py-2 text-xs uppercase tracking-widest text-[#ECE7E1] hover:border-[#C5A059] transition-all flex items-center gap-2"
                  title="Admin Portal"
                >
                  <i data-lucide="lock" className="w-4 h-4 text-[#C5A059]"></i>
                  <span className="hidden md:inline">Admin</span>
                </button>
                <button 
                  onClick={() => setActiveModal('consultation')} 
                  className="bg-[#C5A059] px-6 py-2.5 text-xs uppercase tracking-widest text-black font-semibold hover:bg-[#b08d48] transition-all"
                >
                  Book Consultation
                </button>
              </div>
            </div>
          </nav>

          <!-- Hero Section -->
          <section className="relative h-screen flex items-center justify-center text-center px-6 pt-16">
            <div className="absolute inset-0 z-0">
              <img src="https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=1920&q=80" alt="Hero" className="w-full h-full object-cover brightness-40" />
              <div className="absolute inset-0 bg-gradient-to-t from-[#0A0B0D] via-transparent to-[#0A0B0D]/60"></div>
            </div>
            <div className="max-w-4xl mx-auto z-10 relative">
              <span className="text-[#C5A059] text-xs uppercase tracking-[0.3em] font-semibold block mb-4">Dubai Luxury Waterfront</span>
              <h1 className="text-4xl md:text-6xl font-serif mb-6 leading-tight">{siteData.heroTitle}</h1>
              <p className="text-sm md:text-base text-[#ECE7E1]/80 mb-8 max-w-2xl mx-auto font-light">{siteData.heroSub}</p>
              <button 
                onClick={() => setActiveModal('consultation')} 
                className="bg-[#C5A059] text-black px-8 py-4 text-xs font-semibold uppercase tracking-widest hover:bg-[#b08d48] transition-all"
              >
                Request VIP Access
              </button>
            </div>
          </section>

          <!-- Properties Grid -->
          <section id="properties" className="py-24 bg-[#0F1115] px-6">
            <div className="max-w-7xl mx-auto">
              <div className="text-center mb-16">
                <span className="text-[#C5A059] text-xs uppercase tracking-[0.3em]">Exclusive Inventory</span>
                <h2 className="text-3xl md:text-5xl font-serif mt-2">Available Residences</h2>
              </div>
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
                {siteData.properties.map((prop) => (
                  <div key={prop.id} className="bg-[#0A0B0D] border border-[#ECE7E1]/10 overflow-hidden hover:border-[#C5A059] transition-all">
                    <img src={prop.img} alt={prop.type} className="w-full h-48 object-cover" />
                    <div className="p-6">
                      <h3 className="text-xl font-serif mb-1">{prop.type}</h3>
                      <p className="text-xs text-[#C5A059] uppercase mb-2">{prop.size}</p>
                      <p className="text-lg font-serif text-[#ECE7E1] mb-4">{prop.price}</p>
                      <button 
                        onClick={() => { setSelectedProperty(prop); setActiveModal('inquire'); }}
                        className="w-full border border-[#C5A059] text-[#C5A059] py-2.5 text-xs uppercase tracking-widest hover:bg-[#C5A059] hover:text-black transition-all font-medium"
                      >
                        Inquire Now
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </section>

          <!-- FAQ Accordion -->
          <section id="faq" className="py-24 bg-[#0A0B0D] px-6">
            <div className="max-w-3xl mx-auto">
              <div className="text-center mb-16">
                <span className="text-[#C5A059] text-xs uppercase tracking-[0.3em]">Help & Information</span>
                <h2 class="text-3xl md:text-4xl font-serif mt-2">Frequently Asked Questions</h2>
              </div>
              <div className="space-y-4">
                {faqs.map((faq, i) => (
                  <div key={i} className="border border-[#ECE7E1]/10 bg-[#121418]">
                    <button 
                      onClick={() => setOpenFaq(openFaq === i ? null : i)}
                      className="w-full p-6 text-left flex justify-between items-center text-sm font-serif text-[#ECE7E1]"
                    >
                      <span>{faq.q}</span>
                      <i data-lucide="chevron-down" className={`w-4 h-4 text-[#C5A059] transition-transform ${openFaq === i ? 'rotate-180' : ''}`}></i>
                    </button>
                    {openFaq === i && (
                      <div className="px-6 pb-6 text-xs text-[#ECE7E1]/60 leading-relaxed border-t border-[#ECE7E1]/5 pt-4">
                        {faq.a}
                      </div>
                    )}
                  </div>
                ))}
              </div>
            </div>
          </section>

          <!-- Lead Form Modal -->
          {(activeModal === 'inquire' || activeModal === 'consultation') && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-6">
              <div className="bg-[#121418] border border-[#C5A059]/40 max-w-lg w-full p-8 relative">
                <button onClick={() => setActiveModal(null)} className="absolute top-4 right-4 text-[#ECE7E1]/60 hover:text-white">
                  <i data-lucide="x" className="w-5 h-5"></i>
                </button>
                <h3 className="text-2xl font-serif mb-2">
                  {activeModal === 'inquire' ? `Inquire: ${selectedProperty?.type}` : 'Book Private Consultation'}
                </h3>
                <p className="text-xs text-[#ECE7E1]/60 mb-6">Enter your details below to receive official brochures and floor plans.</p>
                
                {formSuccess ? (
                  <div className="text-center py-8 text-[#C5A059]">
                    <i data-lucide="check-circle" className="w-12 h-12 mx-auto mb-2"></i>
                    <p className="text-sm font-serif">Consultation Request Submitted.</p>
                  </div>
                ) : (
                  <form onSubmit={handleLeadSubmit} className="space-y-4">
                    <!-- Invisible Honeypot Trap for Bots -->
                    <input 
                      type="text" 
                      value={botHoneypot} 
                      onChange={(e) => setBotHoneypot(e.target.value)} 
                      className="hidden" 
                      tabIndex="-1" 
                    />
                    
                    <input type="text" required placeholder="Full Name *" className="w-full bg-[#0A0B0D] border border-[#ECE7E1]/10 px-4 py-3 text-xs outline-none focus:border-[#C5A059] text-white" />
                    <input type="email" required placeholder="Email Address *" className="w-full bg-[#0A0B0D] border border-[#ECE7E1]/10 px-4 py-3 text-xs outline-none focus:border-[#C5A059] text-white" />
                    <input type="tel" required placeholder="Phone / WhatsApp *" className="w-full bg-[#0A0B0D] border border-[#ECE7E1]/10 px-4 py-3 text-xs outline-none focus:border-[#C5A059] text-white" />
                    
                    <button type="submit" className="w-full bg-[#C5A059] text-black py-3 text-xs uppercase tracking-widest font-semibold hover:bg-[#b08d48] transition-all">
                      Submit Request
                    </button>
                  </form>
                )}
              </div>
            </div>
          )}

          <!-- Admin Portal Modal -->
          {activeModal === 'admin' && (
            <div className="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-6">
              <div className="bg-[#121418] border border-[#C5A059] max-w-2xl w-full p-8 relative">
                <button onClick={() => setActiveModal(null)} className="absolute top-4 right-4 text-[#ECE7E1]/60 hover:text-white">
                  <i data-lucide="x" className="w-5 h-5"></i>
                </button>
                
                {!isAdminAuthenticated ? (
                  <div className="max-w-md mx-auto text-center">
                    <i data-lucide="shield-check" className="w-12 h-12 text-[#C5A059] mx-auto mb-4"></i>
                    <h3 className="text-2xl font-serif mb-2">Admin Panel</h3>
                    <p className="text-xs text-[#ECE7E1]/60 mb-6">Enter administrative credentials to modify live pricing and content.</p>
                    <form onSubmit={handleAdminLogin} className="space-y-4">
                      <input 
                        type="password" 
                        placeholder="Password (admin123)" 
                        value={adminPassword} 
                        onChange={(e) => setAdminPassword(e.target.value)} 
                        className="w-full bg-[#0A0B0D] border border-[#ECE7E1]/20 px-4 py-3 text-xs text-center outline-none focus:border-[#C5A059] text-white" 
                      />
                      <button type="submit" className="w-full bg-[#C5A059] text-black py-3 text-xs uppercase tracking-widest font-semibold hover:bg-[#b08d48]">
                        Login
                      </button>
                    </form>
                  </div>
                ) : (
                  <div>
                    <h3 className="text-2xl font-serif mb-6 text-[#C5A059]">Maison Riviera CMS Dashboard</h3>
                    <div className="space-y-6 max-h-[60vh] overflow-y-auto pr-2">
                      <div>
                        <label className="text-xs uppercase text-[#ECE7E1]/60 block mb-2">Edit Hero Headline</label>
                        <input 
                          type="text" 
                          value={siteData.heroTitle} 
                          onChange={(e) => setSiteData({ ...siteData, heroTitle: e.target.value })} 
                          className="w-full bg-[#0A0B0D] border border-[#ECE7E1]/10 px-4 py-2 text-xs text-white outline-none focus:border-[#C5A059]" 
                        />
                      </div>
                      <div>
                        <h4 className="text-xs uppercase text-[#C5A059] mb-4">Update Inventory Prices Live</h4>
                        {siteData.properties.map((prop) => (
                          <div key={prop.id} className="flex justify-between items-center bg-[#0A0B0D] p-3 border border-[#ECE7E1]/10 mb-2">
                            <span className="text-xs font-serif">{prop.type}</span>
                            <input 
                              type="text" 
                              value={prop.price} 
                              onChange={(e) => updatePropertyPrice(prop.id, e.target.value)} 
                              className="bg-[#121418] border border-[#C5A059]/40 px-3 py-1 text-xs text-right text-[#C5A059] outline-none" 
                            />
                          </div>
                        ))}
                      </div>
                    </div>
                    <button 
                      onClick={() => setIsAdminAuthenticated(false)} 
                      className="mt-6 w-full border border-red-500/40 text-red-400 py-2 text-xs uppercase tracking-widest hover:bg-red-500/10"
                    >
                      Logout Admin
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MaisonRivieraApp />);
  </script>
</body>
</html>
